<svg xmlns="http://www.w3.org/2000/svg" width="460" height="130" viewBox="0 0 460 130" fill="none">
  <style>
    .card { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 14; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #ffffff; }
    .artist { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #8b949e; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #22c55e; letter-spacing: 0.5px; }
    
    @keyframes bar1 { 0%, 100% { height: 8px; y: 92px; } 50% { height: 26px; y: 74px; } }
    @keyframes bar2 { 0%, 100% { height: 24px; y: 76px; } 50% { height: 10px; y: 90px; } }
    @keyframes bar3 { 0%, 100% { height: 14px; y: 86px; } 50% { height: 28px; y: 72px; } }
    @keyframes bar4 { 0%, 100% { height: 22px; y: 78px; } 50% { height: 6px; y: 94px; } }
    
    .bar-1 { animation: bar1 1.2s ease-in-out infinite; }
    .bar-2 { animation: bar2 1.0s ease-in-out infinite 0.2s; }
    .bar-3 { animation: bar3 1.4s ease-in-out infinite 0.4s; }
    .bar-4 { animation: bar4 0.9s ease-in-out infinite 0.1s; }
  </style>

  <!-- Background Card -->
  <rect width="460" height="130" rx="14" class="card" />

  <!-- Album Art with rounded corners -->
  <clipPath id="albumClip">
    <rect x="20" y="20" width="90" height="90" rx="10" />
  </clipPath>
  
  <image href="https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/0e/f0/39/0ef03991-a0b3-db13-573f-0fb03bd1c128/745225.jpg/600x600bb.jpg" x="20" y="20" width="90" height="90" clip-path="url(#albumClip)" preserveAspectRatio="xMidYMid slice" />

  <!-- Spotify Logo -->
  <g transform="translate(130, 24)">
    <circle cx="10" cy="10" r="10" fill="#1DB954" />
    <path d="M14.5 13.5C14.3 13.8 13.9 13.9 13.6 13.7C11.5 12.4 8.7 12.2 5.3 12.9C4.9 13 4.6 12.7 4.5 12.4C4.4 12 4.7 11.7 5 11.6C8.8 10.8 11.9 11 14.3 12.5C14.6 12.7 14.7 13.1 14.5 13.5ZM15.8 10.9C15.5 11.3 15 11.4 14.6 11.2C12.1 9.7 8.3 9.3 5.3 10.1C4.8 10.3 4.4 10 4.2 9.6C4.1 9.2 4.3 8.7 4.8 8.6C8.2 7.6 12.5 8.1 15.3 9.8C15.7 10 15.8 10.5 15.8 10.9ZM16 8.3C13 6.5 7.8 6.4 4.7 7.3C4.2 7.5 3.6 7.1 3.5 6.6C3.3 6.1 3.7 5.5 4.2 5.4C7.8 4.3 13.6 4.5 17.1 6.6C17.6 6.9 17.7 7.5 17.4 8C17.1 8.4 16.5 8.6 16 8.3Z" fill="#ffffff" />
  </g>

  <!-- Track Title -->
  <text x="158" y="39" class="title">80 Proof</text>

  <!-- Artist -->
  <text x="130" y="65" class="artist">Eric Reprid</text>

  <!-- Equalizer Bars (4 colors matching screenshot: blue, lilac, violet, orange) -->
  <rect x="130" y="74" width="8" height="26" rx="4" fill="#1d4ed8" class="bar-1" />
  <rect x="144" y="76" width="8" height="24" rx="4" fill="#c084fc" class="bar-2" />
  <rect x="158" y="72" width="8" height="28" rx="4" fill="#a855f7" class="bar-3" />
  <rect x="172" y="78" width="8" height="22" rx="4" fill="#fb923c" class="bar-4" />

  <!-- Live Pulse Dot and Label -->
  <circle cx="196" cy="87" r="3.5" fill="#22c55e" />
  <text x="206" y="91" class="badge">NOW PLAYING</text>
</svg>
